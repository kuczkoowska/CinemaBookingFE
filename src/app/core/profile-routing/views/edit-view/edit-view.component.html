<div class="max-w-xl mx-auto p-6 mt-10 bg-surface-0 border border-surface-200 rounded-xl shadow-sm animate-fade-in">
  <h2 class="text-2xl font-bold mb-6">Edycja Profilu</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">

    <div class="flex flex-col gap-2">
      <label class="font-bold">E-mail</label>
      <input pInputText formControlName="email"/>
    </div>

    <div class="flex flex-col gap-2">
      <label class="font-bold">Imię</label>
      <input pInputText formControlName="firstName"/>
    </div>

    <div class="flex flex-col gap-2">
      <label class="font-bold">Nazwisko</label>
      <input pInputText formControlName="lastName"/>
    </div>

    <div class="flex justify-between mt-6">
      <p-button label="Anuluj" [outlined]="true" severity="secondary" (onClick)="cancel()"></p-button>
      <p-button label="Zapisz zmiany" type="submit" [loading]="isLoading"></p-button>
    </div>
  </form>
</div>
