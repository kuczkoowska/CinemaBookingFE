<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl text-main font-bold mb-8 border-l-4 border-primary pl-4">
    Wszystkie nasze filmy
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-[280px_1fr] gap-8 items-start">
    <app-movie-filter
      [currentFilters]="store.filters()"
      (filterChange)="onFiltersChanged($event)"
    />

    <main>
      @if (store.isLoading()) {
        <app-spinner [label]="'ładowanie filmów...'"/>
      } @else if (store.error()) {
        <div class="p-4 bg-red-100 text-red-700 rounded-lg">Wystąpił błąd: {{ store.error() }}</div>
      } @else {
        @if (store.filteredMovies().length > 0) {
          <p-paginator
            [first]="(store.page() - 1) * store.pageSize()"
            [rows]="store.pageSize()"
            [totalRecords]="store.totalItems()"
            [rowsPerPageOptions]="[6, 9, 12, 18, 24]"
            (onPageChange)="onPageChange($event)"
            class="mb-6"
          />

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
            @for (movie of store.paginatedMovies(); track movie.id) {
              <app-movie-card [movie]="movie"></app-movie-card>
            }
          </div>

          <p-paginator
            [first]="(store.page() - 1) * store.pageSize()"
            [rows]="store.pageSize()"
            [totalRecords]="store.totalItems()"
            [rowsPerPageOptions]="[6, 9, 12, 18, 24]"
            (onPageChange)="onPageChange($event)"
            class="mt-4"
          />
        } @else {
          <div
            class="flex flex-col items-center justify-center py-20 rounded-lg border border-dashed bg-app-element border-app-border"
          >
            <p class="text-xl font-bold mb-2 text-app-text">Brak filmów</p>
            <p class="text-app-muted">Spróbuj zmienić kryteria wyszukiwania.</p>
          </div>
        }
      }
    </main>
  </div>
</div>
