<div class="container mx-auto px-4 py-8">

  <h1 class="text-3xl text-main font-bold mb-8 border-l-4 border-primary pl-4">
    Wszystkie nasze filmy
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-[280px_1fr] gap-8 items-start">

    <app-movie-filter [currentFilters]="store.filters()"
                      (filterChange)="onFiltersChanged($event)"/>

    <main>
      @if (store.isLoading()) {
        <div class="flex justify-center py-20">
          <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
        </div>
      } @else if (store.error()) {
        <div class="p-4 bg-red-100 text-red-700 rounded-lg">
          Wystąpił błąd: {{ store.error() }}
        </div>
      } @else {

        @if (store.filteredMovies().length > 0) {
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            @for (movie of store.filteredMovies(); track movie.id) {
              <app-movie-card [movie]="movie"></app-movie-card>
            }
          </div>
        } @else {
          <div
            class="flex flex-col items-center justify-center py-20 rounded-lg border border-dashed bg-app-element border-app-border">
            <p class="text-xl font-bold mb-2 text-app-text">Brak filmów</p>
            <p class="text-app-muted">Spróbuj zmienić kryteria wyszukiwania.</p>
          </div>
        }

      }
    </main>

  </div>
</div>
