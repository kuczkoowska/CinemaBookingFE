<div
  class="bg-app-element text-app-text border-app-border p-6 rounded-lg shadow-lg border sticky top-24"
>
  <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
    <span>Filtrowanie</span>
    @if (activeFiltersCount() > 0) {
      <p-badge [value]="activeFiltersCount().toString()" severity="info" />
    }
  </h2>

  <form [formGroup]="filterForm" class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="search" class="text-sm font-bold uppercase tracking-wide text-app-muted"
        >Szukaj</label
      >
      <input
        id="search"
        pInputText
        formControlName="searchQuery"
        placeholder="Wpisz tytuł..."
        fluid
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="genre" class="text-sm font-bold uppercase tracking-wide text-app-muted"
        >Gatunek</label
      >
      <p-select
        id="genre"
        formControlName="genre"
        [options]="genreOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Wszystkie gatunki"
        fluid
      />
    </div>

    <div
      class="bg-app-bg flex items-center gap-3 p-3 rounded border border-app-border hover:border-primary cursor-pointer transition-colors"
    >
      <p-checkbox id="adult" formControlName="hideAdult" [binary]="true" />
      <label for="adult" class="text-sm text-app-text">Tylko filmy rodzinne</label>
    </div>

    <p-button (onClick)="filterForm.reset()" label="Wyczyść filtry" fluid />
  </form>
</div>
