<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-3">
      <app-back-dashboard />
      <h1 class="text-3xl font-bold">Logi Systemowe</h1>
    </div>

    <div class="flex gap-3 items-center">
      <label for="logTypeFilter" class="font-medium">Filtruj po typie:</label>
      <p-select
        id="logTypeFilter"
        [(ngModel)]="selectedType"
        [options]="logTypes"
        optionLabel="label"
        optionValue="value"
        (onChange)="onFilterChange()"
        [style]="{ width: '200px' }"
      >
      </p-select>

      <button pButton icon="pi pi-refresh" (click)="loadLogs()">Odśwież</button>
    </div>
  </div>

  <p-table [value]="logs()" [tableStyle]="{ 'min-width': '60rem' }" [rows]="20" [paginator]="true">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id" /></th>
        <th pSortableColumn="timestamp">Data i Czas <p-sortIcon field="timestamp" /></th>
        <th pSortableColumn="type">Typ <p-sortIcon field="type" /></th>
        <th>Wiadomość</th>
        <th pSortableColumn="userId">ID Użytkownika <p-sortIcon field="userId" /></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr>
        <td>{{ log.id }}</td>
        <td>{{ log.timestamp | date: 'dd.MM.yyyy HH:mm:ss' }}</td>
        <td>
          <p-tag [value]="log.type" [severity]="getLogSeverity(log.type)"></p-tag>
        </td>
        <td>{{ log.message }}</td>
        <td>{{ log.userId || '-' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-4">Brak logów do wyświetlenia</td>
      </tr>
    </ng-template>
  </p-table>
</div>
