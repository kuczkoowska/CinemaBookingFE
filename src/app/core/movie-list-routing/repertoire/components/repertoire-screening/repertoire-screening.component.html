<button
  pButton
  pRipple
  [pTooltip]="tooltipText()"
  tooltipPosition="top"
  (click)="onClick()"
  [disabled]="isDisabled()"
  class="relative border-2 font-bold px-6 py-2 transition-all"
  [class.p-button-outlined]="!isDisabled()"
  [class.hover:bg-primary]="!isDisabled()"
  [class.hover:text-white]="!isDisabled()"
  [class.hover:border-primary]="!isDisabled()"
  [class.opacity-40]="isPast()"
  [class.grayscale]="isPast()"
  [class.line-through]="isPast()"
  [class.opacity-60]="isSoldOut() && !isPast()"
  [class.border-orange-500]="isLowSeats()"
  [class.text-orange-500]="isLowSeats()"
>
  {{ screening().startTime | date: 'HH:mm' }}

  @if (isLowSeats()) {
    <span
      class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold"
    >
      {{ screening().availableSeats }}
    </span>
  }

  @if (isSoldOut() && !isPast()) {
    <span
      class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold"
    >
      ✕
    </span>
  }
</button>
