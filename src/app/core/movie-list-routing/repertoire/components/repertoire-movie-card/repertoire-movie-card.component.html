<div
  class="group flex flex-row gap-4 p-4 bg-element border border-app-border rounded-xl shadow-sm hover:shadow-md hover:border-primary/30 transition-all duration-300">

  <a [routerLink]="['/movie', item().movie.id]"
     class="relative w-24 md:w-32 shrink-0 overflow-hidden rounded-lg aspect-2/3 cursor-pointer">
    <img
      [src]="item().movie.posterUrl"
      [alt]="item().movie.title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
    />
  </a>

  <div class="flex-1 flex flex-col min-w-0">
    <div class="flex flex-wrap items-center gap-2 mb-1">
      <a [routerLink]="['/movie', item().movie.id]"
         class="text-lg font-bold text-main group-hover:text-primary transition-colors no-underline hover:underline truncate">
        {{ item().movie.title }}
      </a>
      <p-tag [value]="item().movie.ageRating + '+'" class="text-xs"/>
    </div>

    <div class="flex items-center gap-3 text-xs text-app-muted mb-2">
      <span class="flex items-center gap-1">
        <i class="pi pi-clock"></i> {{ item().movie.durationMinutes }} min
      </span>
      <span>{{ item().movie.genre }}</span>
    </div>

    <div class="flex flex-wrap gap-2 mt-auto">
      @for (screening of item().screenings; track screening.id) {
        <app-repertoire-screening
          [screening]="screening"
          (selectScreening)="screeningSelect.emit($event)"
        />
      }
    </div>
  </div>
</div>
