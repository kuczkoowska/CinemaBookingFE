<div class="mb-8 sticky top-0 z-50 py-4 border-b border-app-border bg-app-bg/95 backdrop-blur-sm">

  <div class="flex items-center gap-4 overflow-x-auto pb-2 no-scrollbar">

    @for (day of weekDays(); track day) {
      <app-day-button
        [day]="day"
        [isSelected]="isSelected(day)"
        (selectDay)="dateSelected.emit($event)"/>
    }

    <div class="w-px h-10 bg-app-border mx-2"></div>

    <p-date-picker
      [ngModel]="selectedDate()"
      (ngModelChange)="dateSelected.emit($event)"
      placeholder="Inna data"
      [showIcon]="true"
      iconDisplay="input"
      dateFormat="dd.mm.yy"
      [appendTo]="'body'">
    </p-date-picker>
  </div>
</div>
