<div class="container mx-auto p-4 animate-fade-in pb-20">

  <app-repertoire-calendar
    [weekDays]="store.weekDays()" [selectedDate]="store.selectedDate()"
    (dateSelected)="selectDate($event)"
  />

  @if (store.isLoading()) {
    <div class="flex flex-col gap-6">
      @for (i of [1, 2, 3]; track i) {
        <app-skeleton-repertoire/>
      }
    </div>
  } @else {

    @if (store.movies().length > 0) {
      <div class="flex flex-col gap-6">

        @for (item of store.movies(); track item.movie.id) {
          <app-repertoire-movie-card
            [item]="item"
            (screeningSelect)="handleScreeningSelect($event)"
          />
        }
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center py-20 text-app-muted">
        <div class="w-20 h-20 bg-element rounded-full flex items-center justify-center mb-4">
          <i class="pi pi-calendar-times text-4xl"></i>
        </div>
        <h3 class="text-xl font-bold text-main">Brak seansów w tym dniu</h3>
        <p>Wybierz inną datę z kalendarza.</p>
      </div>
    }
  }
</div>
