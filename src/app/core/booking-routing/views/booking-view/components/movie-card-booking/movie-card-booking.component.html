<p-card class="shadow-lg bg-app-border">
  <div class="flex flex-col md:flex-row gap-6">

    <div class="flex justify-center md:justify-start">
      <p-image
        [src]="movie().posterUrl"
        [alt]="movie().title"
        width="128"
        height="192"
        imageClass="rounded-xl object-cover"
        [preview]="true">
      </p-image>
    </div>

    <div class="flex-1 flex flex-col gap-4">

      <div class="flex flex-row justify-between">
        <div class="flex flex-col gap-1">
          <p class="text-xs text-muted uppercase tracking-wider font-bold">
            Kupujesz bilety na
          </p>

          <h2 class="text-2xl md:text-3xl font-black leading-tight">
            {{ movie().title }}
          </h2>

          <div class="flex flex-wrap gap-2 text-sm text-muted">
            <span>{{ movie().genre }}</span>
            <span>•</span>
            <span>{{ movie().durationMinutes }} min</span>
          </div>
        </div>

        <div class="flex flex-col">
          <p class="text-xs text-muted uppercase tracking-wider font-bold">
            Sala
          </p>
          <p class="text-lg font-bold">
            {{ screening().theaterRoomName }}
          </p>
        </div>
      </div>

      <p-divider></p-divider>

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

        <div class="flex flex-col">
          <p class="text-xs text-muted uppercase tracking-wider font-bold mb-1">
            Data seansu
          </p>
          <p class="text-lg font-bold">
            {{ screening().startTime | date:'EEEE, d MMMM y' }}
          </p>
        </div>

        <div class="flex items-center gap-4">
          <div class="text-2xl md:text-3xl font-black text-primary">
            {{ screening().startTime | date:'shortTime' }}
          </div>

          <p-button
            label="Zmień termin"
            [text]="true"
            size="small"
            severity="secondary">
          </p-button>
        </div>

      </div>

    </div>
  </div>
</p-card>
