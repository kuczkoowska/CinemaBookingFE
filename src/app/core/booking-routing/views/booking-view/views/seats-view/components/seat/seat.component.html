<button
  (click)="store.toggleSeat(seat().id)"
  [disabled]="!seat().available"
  [pTooltip]="'Rząd: ' + seat().rowNumber + ', Miejsce: ' + seat().seatNumber"
  tooltipPosition="top"
  class="w-10 h-10 rounded-t-lg transition-all duration-200 flex items-center justify-center text-xs font-bold border shadow-sm relative"
  [ngClass]="{
                'bg-gray-700 border-gray-600 cursor-not-allowed opacity-30': !seat().available,
                'bg-element hover:bg-primary/20 border-primary text-main cursor-pointer': seat().available && !seat().isSelected,
                'bg-primary border-primary text-white scale-110 shadow-lg cursor-pointer z-10': seat().isSelected
              }">

  {{ seat().seatNumber }}

  <div class="absolute bottom-0 w-full h-1 bg-black/20"></div>
</button>
