<div class="bg-surface-0 p-6 border rounded-xl shadow-sm flex flex-col gap-4">
  <h3 class="font-bold text-lg flex items-center gap-2">
    Imiona na biletach <span class="text-sm font-normal text-gray-400 ml-auto">(Opcjonalne)</span>
  </h3>

  <div class="flex flex-col gap-3">
    @for (control of holdersArray().controls; track $index) {
      <div [formGroup]="control" class="flex items-center gap-4 p-3 border rounded-lg bg-gray-50">
        <div class="w-10 h-10 bg-white border text-primary-700 font-bold flex items-center justify-center rounded-lg">
          {{ control.controls.seatNumber.value }}
        </div>
        <div class="flex-1">
          <input pInputText formControlName="name" [id]="'holder'+$index" placeholder="Dla kogo ten bilet?"
                 class="w-full p-inputtext-sm"/>
        </div>
      </div>
    }
  </div>
</div>
