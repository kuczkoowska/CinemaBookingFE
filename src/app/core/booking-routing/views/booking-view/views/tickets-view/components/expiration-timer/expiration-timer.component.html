@if (store.expirationTime()) {
  <div class="flex justify-center mb-6 animate-fade-in">

    @if (timeDiff() === 0) {
      <p-message severity="error" text="Czas minął!"></p-message>
    } @else {
      <div class="flex items-center gap-3 bg-surface-0 px-4 py-2 rounded-full border shadow-sm">
        <span class="text-gray-500 font-bold text-xs uppercase">Czas:</span>

        <p-tag
          [value]="(timeDiff() | date:'mm:ss':'UTC') || '00:00'"
          severity="warn"
          [rounded]="true"
          class="font-mono text-lg font-bold"
        ></p-tag>

      </div>
    }

  </div>
}
