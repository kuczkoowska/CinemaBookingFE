<div
  class="bg-element border border-app-border rounded-2xl p-8 text-center shadow-2xl mt-10"
>
  <div class="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
    <i class="pi pi-check text-5xl text-white font-bold"></i>
  </div>

  <h2 class="text-3xl font-bold text-main mb-2">Płatność przyjęta!</h2>
  <p class="text-(--text-muted) mb-4">Twoje bilety zostały wysłane na e-mail.</p>

  <div class="bg-linear-to-br from-primary-50 to-primary-100 p-6 rounded-xl mb-6">
    <p class="text-sm text-primary-900">Życzymy miłego seansu w naszym kinie.</p>
  </div>

  <div class=" p-6">

    <p class="text-xs uppercase text-app-muted mb-2 font-bold">
      Twój numer rezerwacji
    </p>
    <p class="text-4xl font-bold text-primary">
      #{{ bookingId() }}
    </p>
  </div>

  <div class="flex flex-col gap-3">
    <p-button label="Wróć do repertuaru" (onClick)="goHome.emit()" fluid/>
    <p-button label="Szczegóły" (onClick)="viewBooking.emit()" fluid/>
  </div>
</div>
