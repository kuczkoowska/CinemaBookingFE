<div class="relative">
  <p-button
    (click)="menu.toggle($event)"
    [rounded]="true"
  >
    {{ initials() }}
  </p-button>

  <p-menu
    #menu
    [model]="menuItems()"
    [popup]="true"
    appendTo="body"
    styleClass="w-64 mt-2"
  >
    <ng-template pTemplate="start">
      <div
        class="flex flex-col gap-1 p-3 mb-1 border-b border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-600">
        <span class="font-bold text-sm text-surface-900 dark:text-surface-0 truncate">
          {{ auth.displayName() }}
        </span>
        <span class="text-xs text-surface-500 dark:text-surface-400 truncate">
          {{ auth.user()?.email }}
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="item" let-item>

      @if (item.separator) {
        <div class="h-px bg-surface-200 dark:bg-surface-700 my-1 mx-3"></div>
      } @else {
        @if (item.routerLink) {
          <a [routerLink]="item.routerLink"
             class="flex items-center p-3 duration-200 rounded-md mx-1">

            <span [class]="item.icon" class="mr-3 text-primary"></span>

            <span class="flex-1 text-sm font-medium">{{ item.label }}</span>

            @if (item.badge) {
              <span class="bg-primary text-primary-contrast text-xs font-bold rounded-full px-2 py-0.5 ml-auto">
                 {{ item.badge }}
               </span>
            }
          </a>
        } @else {
          <button
            type="button"
            (click)="item.command ? item.command() : null"
            class="w-full text-left flex items-center p-3 cursor-pointer">

            <span [class]="item.icon" class="mr-3 text-primary"></span>
            <span class="flex-1 text-sm font-medium">{{ item.label }}</span>

            @if (item.badge) {
              <span class="bg-primary text-xs">
                  {{ item.badge }}
              </span>
            }
          </button>
        }
      }
    </ng-template>
  </p-menu>
</div>
