<nav class="sticky top-0 z-50 w-full h-16 bg-app-nav shadow-lg transition-colors duration-300">


  <div class="container mx-auto px-4 h-full flex items-center justify-between">

    <a [routerLink]="['/']"
       class="flex items-center gap-2 cursor-pointer group shrink-0">
      <i class="pi pi-video text-2xl"></i>
      <span class="text-2xl font-bold tracking-tighter">
        CINEMA<span class="text-primary group-hover:text-primary-hover transition-colors">APP</span>
      </span>
    </a>

    <div class="hidden md:flex items-center gap-6 h-full">
      @for (link of navLinks; track link.route) {
        <a [routerLink]="['/', link.route]"
           class="relative h-full flex items-center text-sm uppercase font-semibold tracking-wide hover:text-primary">
          {{ link.label }}
        </a>
      }
    </div>

    <div class="flex items-center gap-2 md:gap-4">

      <p-button
        (onClick)="themeService.toggleTheme()"
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        [text]="true"
        severity="secondary"
        pTooltip="Zmień motyw"
        tooltipPosition="bottom"
      />

      <button class="text-xs font-bold text-app-muted hover:text-primary transition-colors p-2">
        PL
      </button>

      <div class="h-6 w-[1px] bg-app-border mx-1"></div>

      @if (!auth.isLoading()) {
        @if (auth.isAuthenticated()) {
          <app-user-menu/>
        } @else {
          <p-button
            [routerLink]="['/', AppRoute.LOGIN]"
            label="Zaloguj"
            size="small"
            class="hidden sm:block"
          />
        }
      }

    </div>
  </div>
</nav>
